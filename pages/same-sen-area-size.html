  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 1px 1px, #343434 1px, transparent 1.2px) 0 0 / 20px 20px,
        #181818;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
    }
    .panel {
      width: min(620px, calc(100vw - 40px));
      padding: 28px;
      border: 2px solid #777;
      border-radius: 12px;
      background: #202020;
    }
    h1 { margin: 0 0 18px; font-size: 24px; font-weight: 500; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    a, button {
      border: 1px solid #777;
      background: #202020;
      color: #eee;
      padding: 11px 14px;
      border-radius: 6px;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }
    a:hover, button:hover { border-color: #fff; }
    .note {
      margin: 18px 0 0;
      font-size: 12px;
      line-height: 1.5;
      color: #aaa;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>WHAT CAN YOU DO WITH A MISTAKE?</h1>
    <div class="actions">
      <a href="schema-map.html">OPEN HYPERLINKED MAP</a>
      <button type="button" onclick="openNode('root')">OPEN ROOT POPUP</button>
      <button type="button" onclick="openFullSchema()">OPEN ALL POPUPS</button>
    </div>
    <p class="note">
      All popup HTML files are preloaded into the browser cache. Clicking a connection
      inside a popup opens the linked node at its configured coordinate.
    </p>
  </main>
  <script src="schema-popups.js"></script>
  <script>preloadSchema();</script>
