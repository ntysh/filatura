<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>algorithm hardware</title>
  <link rel="prefetch" href="quote-01.html">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      max-width: 100%;
    }
    button:focus-visible {
      outline: 1px dotted currentColor;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <button type="button" aria-label="Open Donna Haraway quote: partial perspective" onclick="openQuote()">
    <div style="display: inline-flex; text-align: center; justify-content: center; align-items: center; line-height: 100%; padding: 7.7px; font-size: 12px; font-style: oblique; object-fit: contain; font-family: &quot;Arial Narrow&quot;; background: linear-gradient(45deg, rgb(255, 182, 244), rgb(255, 255, 255)); border: 1px solid rgb(255, 182, 244); text-shadow: rgb(255, 182, 244) 0px 1px 3px;">algorithm hardware<img src="https://autopoies.is/buttons/img/68.gif" style="max-height: 32px;"></div>
  </button>

  <script>
    function openQuote() {
      const width = 310;
      const height = 155;

      // Open the quote immediately to the right of this little button window.
      const left = Math.round(window.screenX + window.outerWidth + 12);
      const top = Math.round(window.screenY + 8);

      window.open(
        "quote-01.html",
        "haraway-quote-01",
        [
          `width=${width}`,
          `height=${height}`,
          `left=${left}`,
          `top=${top}`,
          "resizable=yes",
          "scrollbars=no",
          "toolbar=no",
          "menubar=no",
          "location=no",
          "status=no"
        ].join(",")
      );
    }

    // Warm the quote file before the click.
    fetch("quote-01.html", { cache: "force-cache" }).catch(() => null);
  </script>
</body>
</html>
