<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 18px;
      background: #fff;
      color: #111;
      font-family: "Times New Roman", Times, serif;
    }
    figure {
      margin: 0;
      width: 100%;
    }
    blockquote {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      font-style: italic;
    }
    figcaption {
      margin-top: 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <figure>
    <blockquote>“If computers are the power looms of the modern industrial revolution, software is more like knitting. Programmers still toil in digital sweatshops, coding software by hand, writing and rewriting one tangled line after another. Not surprisingly, they sometimes drop a stitch, which later unravels as a bug in the program’.”</blockquote>
    <figcaption> – The Economist (1994), as cited in Sadie Plant</figcaption>
  </figure>
</body>
</html>
