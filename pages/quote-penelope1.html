<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 18px;
      background: #fff;
      color: #111;
      font-family: "Times New Roman", Times, serif;
    }

    figure {
      margin: 0;
      width: 100%;
    }

    blockquote {
      margin: 0;
      font-size: 24px;
      line-height: 1.05;
      font-style: italic;
    }

    figcaption {
      margin-top: 14px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9px;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
  </style>
</head>

  <figure>

14:19 the Operator warned me specifically about this kind of breakage and said it happens to everyone in the early stages of learning, but now he’s gone back to the farm and this week I’m alone here with the machine! will I manage to find the right repair instructions and explain what’s going on over the phone to him... remains to be seen.
’</blockquote>
    <figcaption>Field Diary</figcaption>
  </figure>
</body>
</html>
