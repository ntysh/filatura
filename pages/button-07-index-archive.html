<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>index me archive me</title>
  <link rel="prefetch" href="quote-07.html">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      max-width: 100%;
    }
    button:focus-visible {
      outline: 1px dotted currentColor;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <button type="button" aria-label="Open Donna Haraway quote: not just any partial perspective will do" onclick="openQuote()">
    <div style="display: inline-flex; text-align: center; justify-content: center; align-items: center; line-height: 100%; padding: 5.5px; font-size: 12px; font-style: italic; color: rgb(255, 182, 244); border: 6px dashed rgb(255, 182, 244); text-decoration: underline wavy;"><marquee scrollamount="2" direction="left">index me archive me</marquee><img src="https://autopoies.is/buttons/img/15.gif" style="max-height: 32px;"></div>
  </button>

  <script>
    function openQuote() {
      const width = 350;
      const height = 165;

      // Open the quote immediately to the right of this little button window.
      const left = Math.round(window.screenX + window.outerWidth + 12);
      const top = Math.round(window.screenY + 8);

      window.open(
        "quote-07.html",
        "haraway-quote-07",
        [
          `width=${width}`,
          `height=${height}`,
          `left=${left}`,
          `top=${top}`,
          "resizable=yes",
          "scrollbars=no",
          "toolbar=no",
          "menubar=no",
          "location=no",
          "status=no"
        ].join(",")
      );
    }

    // Warm the quote file before the click.
    fetch("quote-07.html", { cache: "force-cache" }).catch(() => null);
  </script>
</body>
</html>
