<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOOL PROCESS !!</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background:
        url("data:image/gif;base64,R0lGODlhBAAEAIAAAOvr6////yH5BAEAAAEALAAAAAAEAAQAAAIHjI+py+0Po5yUFQA7"),
        #d7f7ff;
      color: #000;
      font-family: "Times New Roman", Times, serif;
      cursor: crosshair;
    }

    .page {
      width: 760px;
      max-width: calc(100vw - 20px);
      margin: 14px auto;
      padding: 8px;
      border: 4px ridge #ff66cc;
      background: #fff7fb;
    }

    h1 {
      margin: 4px 0 8px;
      text-align: center;
      font-size: 28px;
      color: #ff1493;
      text-shadow: 2px 2px #ffff00;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #0000ff;
      margin-bottom: 6px;
    }

    .divider {
      text-align: center;
      font-family: monospace;
      color: #00a050;
      margin: 5px 0 10px;
      white-space: nowrap;
      overflow: hidden;
    }

    .chain {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 8px;
      border: 2px dashed #00a0ff;
      background: #fff;
    }

    .step {
      display: inline-block;
      padding: 5px 7px;
      border: 2px outset #ccc;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: bold;
      text-decoration: underline;
      box-shadow: 2px 2px 0 #999;
    }

    .eq {
      color: #ff00aa;
      font-weight: bold;
      font-size: 18px;
    }

    .s1  { background: #ccddff; color: #003399; }
    .s2  { background: #ccffcc; color: #006600; }
    .s3  { background: #ffff99; color: #663300; }
    .s4  { background: #ffccdd; color: #990033; }
    .s5  { background: #e0ccff; color: #4b0082; }
    .s6  { background: #ccffff; color: #006666; }
    .s7  { background: #ffddbb; color: #993300; }
    .s8  { background: #ffccff; color: #990099; }
    .s9  { background: #cce5ff; color: #000099; }
    .s10 { background: #ddffbb; color: #336600; }
    .s11 { background: #ffd5c2; color: #8b2500; }

    marquee {
      margin-top: 10px;
      color: #ff00aa;
      font-family: "Comic Sans MS", cursive;
      font-weight: bold;
      background: #ffffcc;
      border: 1px dotted #ff00aa;
    }

    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 11px;
      color: #666;
    }

    .blink {
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% { visibility: hidden; }
    }

    @media (max-width: 640px) {
      .page {
        width: auto;
      }

      .chain {
        gap: 4px;
      }

      .step {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>✿ WOOL TRANSFORMATION ✿</h1>

    <div class="subtitle">
      <span class="blink">***</span>
      no alienation!! hopefully
      <span class="blink">***</span>
    </div>

    <div class="divider">
      ~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~*~
    </div>

    <div class="chain">
      <span class="step s1">Mountains</span>
      <span class="eq">=</span>
      <span class="step s2">Plants</span>
      <span class="eq">=</span>
      <span class="step s3">Sheep</span>
      <span class="eq">=</span>
      <span class="step s4">Trimming</span>
      <span class="eq">=</span>
      <span class="step s5">Sorting</span>
      <span class="eq">=</span>
      <span class="step s6">Washing</span>
      <span class="eq">=</span>
      <span class="step s7">Drying</span>
      <span class="eq">=</span>
      <span class="step s8">Spinning</span>
      <span class="eq">=</span>
      <span class="step s9">Knitting</span>
      <span class="eq">=</span>
      <span class="step s10">Sewing</span>
      <span class="eq">=</span>
      <span class="step s11">Packing</span>
    </div>

    <marquee scrollamount="3">
      ☆ sheep → yarn → fabric → garment ☆ sheep → yarn → fabric → garment ☆
    </marquee>

  </div>
</body>
</html>
