<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CLICK to be loved / glitched / understood</title>
  <link rel="prefetch" href="quote-05.html">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      max-width: 100%;
    }
    button:focus-visible {
      outline: 1px dotted currentColor;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <button type="button" aria-label="Open Donna Haraway quote: webs of connections" onclick="openQuote()">
    <div style="display: inline-flex; text-align: center; justify-content: center; align-items: center; line-height: 100%; padding: 5.5px; font-size: 15px; font-style: oblique; object-fit: contain; font-family: monospace; background: rgb(247, 248, 248); color: rgb(232, 0, 0); border: 4px solid rgb(232, 0, 0); border-radius: 18px; text-shadow: rgb(232, 0, 0) 0px 2px 3px;">CLICK to be loved! <br>CLICK to be glitched!<br>CLICK to be glitched!<br>CLICK to be understood!<img src="https://autopoies.is/buttons/img/18.gif" style="max-height: 32px;"></div>
  </button>

  <script>
    function openQuote() {
      const width = 320;
      const height = 160;

      // Open the quote immediately to the right of this little button window.
      const left = Math.round(window.screenX + window.outerWidth + 12);
      const top = Math.round(window.screenY + 8);

      window.open(
        "quote-05.html",
        "haraway-quote-05",
        [
          `width=${width}`,
          `height=${height}`,
          `left=${left}`,
          `top=${top}`,
          "resizable=yes",
          "scrollbars=no",
          "toolbar=no",
          "menubar=no",
          "location=no",
          "status=no"
        ].join(",")
      );
    }

    // Warm the quote file before the click.
    fetch("quote-05.html", { cache: "force-cache" }).catch(() => null);
  </script>
</body>
</html>
